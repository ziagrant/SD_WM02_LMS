<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approve Employee Accounts</title>

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard">

    <!-- Sidebar (HR only - all links go to HR pages) -->
    <div class="sidebar">

        <h2>LMS HR</h2>

        <ul>
            <li><a href="hr-dashboard.html">Dashboard</a></li>
            <li class="active">Approve Accounts</li>
            <li><a href="review-leaves.html">Review Leaves</a></li>
            <li><a href="reports.html">Reports</a></li>
            <li><a href="hr-login.html">Logout</a></li>
        </ul>

    </div>

    <!-- Main Content -->
    <div class="main">

        <header>
            <h1>Approve Employee Accounts</h1>
            <p>Review new employee registrations before granting access.</p>
        </header>

        <!-- Search -->
        <div class="search-box">
            <input
                type="text"
                id="searchEmployee"
                placeholder="Search employee..."
            >
        </div>

        <!-- Employee Accounts Table -->
        <div class="table-container">

            <table class="accounts-table">

                <thead class="accounts-table__head">
                    <tr>
                        <th class="accounts-table__header">Employee ID</th>
                        <th class="accounts-table__header">Name</th>
                        <th class="accounts-table__header">Email</th>
                        <th class="accounts-table__header">Department</th>
                        <th class="accounts-table__header">Status</th>
                        <th class="accounts-table__header">Action</th>
                    </tr>
                </thead>

                <!-- Rows are populated dynamically by script.js so new accounts show up -->
                <tbody class="accounts-table__body" id="accountsTableBody">
                </tbody>

            </table>

        </div>

        <!-- Summary Cards (updated dynamically) -->
        <div class="cards">

            <div class="card">
                <h2 id="totalEmployees">—</h2>
                <p>Total Employees</p>
            </div>

            <div class="card">
                <h2 id="pendingApproval">—</h2>
                <p>Pending Approval</p>
            </div>

            <div class="card">
                <h2 id="approvedAccounts">—</h2>
                <p>Approved</p>
            </div>

        </div>

    </div>

</div>

<!-- Script -->
<script src="script.js"></script>

</body>
</html>
