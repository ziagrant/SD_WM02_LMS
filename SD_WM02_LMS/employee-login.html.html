<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login | Leave Management System</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">

<div class="auth-container">

    <!-- Left Panel -->
    <div class="auth-left">
        <h2>LMS-CHACKS CREATIVE TECH</h2>
        <p>Create your account, register now.</p>
    </div>

    <!-- Right Panel -->
    <div class="auth-right">

        <div class="auth-welcome">WELCOME BACK</div>
        <h1>Employee Login</h1>
        <p class="auth-subtitle">Sign in to your account</p>

        <!-- Employee Login Form -->
        <form class="auth-form" action="employee-dashboard.html">

            <label for="emp-email">Email Address</label>
            <input
                type="email"
                id="emp-email"
                name="email"
                placeholder="Enter email"
            >

            <label for="emp-password">Password</label>
            <input
                type="password"
                id="emp-password"
                name="password"
                placeholder="Enter password"
            >

            <button type="submit">Sign in →</button>

        </form>

        <div class="auth-links">
            <a href="signup.html">New account? Create account</a>
            <a href="hr-login.html">HR Manager Login</a>
        </div>

    </div>

</div>

</body>
</html>
