<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Leave Requests</title>

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard">

    <!-- Sidebar (HR only - all links go to HR pages) -->
    <div class="sidebar">

        <h2>LMS HR</h2>

        <ul>
            <li><a href="hr-dashboard.html">Dashboard</a></li>
            <li><a href="approve-accounts.html">Approve Accounts</a></li>
            <li class="active">Review Leaves</li>
            <li><a href="reports.html">Reports</a></li>
            <li><a href="hr-login.html">Logout</a></li>
        </ul>

    </div>

    <!-- Main Content -->
    <div class="main">

        <header>
            <h1>Review Leave Requests</h1>
            <p>Review employee leave applications and update their status.</p>
        </header>

        <!-- Summary Cards (updated dynamically by script.js) -->
        <div class="cards">

            <div class="card">
                <h2 id="totalRequests">—</h2>
                <p>Total Requests</p>
            </div>

            <div class="card">
                <h2 id="pendingRequests">—</h2>
                <p>Pending</p>
            </div>

            <div class="card">
                <h2 id="approvedRequests">—</h2>
                <p>Approved</p>
            </div>

            <div class="card">
                <h2 id="rejectedRequests">—</h2>
                <p>Rejected</p>
            </div>

        </div>

        <!-- Search -->
        <div class="search-box">
            <input
                type="text"
                id="searchEmployee"
                placeholder="Search employee or leave type..."
            >
        </div>

        <!-- Leave Requests Table -->
        <div class="table-container">

            <table class="leaves-table">

                <thead class="leaves-table__head">
                    <tr>
                        <th class="leaves-table__header">Employee</th>
                        <th class="leaves-table__header">Leave Type</th>
                        <th class="leaves-table__header">Start Date</th>
                        <th class="leaves-table__header">End Date</th>
                        <th class="leaves-table__header">Reason</th>
                        <th class="leaves-table__header">Status</th>
                        <th class="leaves-table__header">Action</th>
                    </tr>
                </thead>

                <!-- Rows are populated dynamically by script.js -->
                <tbody class="leaves-table__body" id="leavesTableBody">
                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Script -->
<script src="script.js"></script>

</body>
</html>
