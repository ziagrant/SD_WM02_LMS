<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Employee Account</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css">

</head>
<body class="auth-page">

<div class="auth-container auth-container--wide">

    <!-- Left Panel -->
    <div class="auth-left">
        <h2>Join LMS</h2>
        <p>
            Register your employee account to request leave,
            track approvals and manage your profile.
        </p>
    </div>

    <!-- Right Panel -->
    <div class="auth-right">

        <h1>Create Account</h1>
        <p class="auth-subtitle">Fill in your information below.</p>

        <!-- Signup Form -->
        <form class="signup-form" id="signupForm">

            <div class="form-row">

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" placeholder="First Name">
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Last Name">
                </div>

            </div>

            <div class="form-group">
                <label for="empNumber">Employee Number</label>
                <input type="text" id="empNumber" name="empNumber" placeholder="EMP001">
            </div>

            <div class="form-group">
                <label for="signupEmail">Email Address</label>
                <input type="email" id="signupEmail" name="email" placeholder="example@email.com">
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department" name="department" placeholder="IT Department">
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" name="password">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword">
                </div>

            </div>

            <button type="submit">Create Account</button>

        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="employee-login.html">Login Here</a>
        </div>

    </div>

</div>

<!-- Script -->
<script src="script.js"></script>

</body>
</html>
