<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Leave Requests</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <div class="sidebar">
        <h2>LMS HR</h2>
        <ul>
            <li><a href="review-leaves.html">Dashboard</a></li>
            <li><a href="approve-accounts.html">Approve Accounts</a></li>
            <li class="active"><a href="review-leaves.html">Review Leaves</a></li>
            <li><a href="report.html">Reports</a></li>
            <li id="logoutBtn"><a href="#">Logout</a></li>
        </ul>
    </div>

    <div class="main">

        <header>
            <h1>Review Leave Requests</h1>
            <p>Review employee leave applications and update their status.</p>
        </header>

        <div class="cards">
            <div class="card">
                <h2 id="totalLeaves">—</h2>
                <p>Total Requests</p>
            </div>
            <div class="card">
                <h2 id="pendingLeaves">—</h2>
                <p>Pending</p>
            </div>
            <div class="card">
                <h2 id="approvedLeaves">—</h2>
                <p>Approved</p>
            </div>
            <div class="card">
                <h2 id="rejectedLeaves">—</h2>
                <p>Rejected</p>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="searchLeave" placeholder="Search employee or leave type...">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Employee</th>
                        <th>Leave Type</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="leavesTableBody">
                </tbody>
            </table>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
