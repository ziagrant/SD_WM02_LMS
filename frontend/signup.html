<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Employee Account</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body{ background:#f3f4f8; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .container{ width:1000px; background:white; display:flex; border-radius:10px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.1); }
        .left{ width:40%; background:#33003f; color:white; padding:50px; display:flex; justify-content:center; align-items:center; flex-direction:column; }
        .left h2{ font-size:28px; margin-bottom:15px; }
        .left p{ text-align:center; color:#dddddd; line-height:25px; }
        .right{ width:60%; padding:45px; }
        h1{ margin-bottom:8px; color:#222; }
        .sub{ color:gray; margin-bottom:30px; }
        .row{ display:flex; gap:15px; }
        .input-group{ width:100%; margin-bottom:18px; }
        label{ display:block; margin-bottom:6px; color:#444; font-size:14px; }
        input{ width:100%; padding:12px; border:1px solid #cccccc; border-radius:5px; outline:none; }
        input:focus{ border-color:#4ea8ff; }
        button{ width:100%; padding:14px; background:#8fd5ff; border:none; border-radius:5px; font-size:16px; font-weight:600; cursor:pointer; transition:.3s; }
        button:hover{ background:#6bc5ff; }
        .footer{ text-align:center; margin-top:20px; }
        .footer a{ color:#33003f; text-decoration:none; font-weight:500; }
    </style>
</head>
<body>

<div class="container">

    <div class="left">
        <h2>Join LMS</h2>
        <p>Register your employee account to request leave, track approvals and manage your profile.</p>
    </div>

    <div class="right">

        <h1>Create Account</h1>
        <p class="sub">Fill in your information below.</p>

        <div id="signupMsg"></div>

        <form id="signupForm">

            <div class="row">
                <div class="input-group">
                    <label>First Name</label>
                    <input id="firstName" type="text" placeholder="First Name">
                </div>
                <div class="input-group">
                    <label>Last Name</label>
                    <input id="lastName" type="text" placeholder="Last Name">
                </div>
            </div>

            <div class="input-group">
                <label>Employee Number</label>
                <input id="empNumber" type="text" placeholder="EMP001">
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input id="signupEmail" type="email" placeholder="example@email.com">
            </div>

            <div class="input-group">
                <label>Department</label>
                <input id="department" type="text" placeholder="IT Department">
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Password</label>
                    <input id="signupPassword" type="password">
                </div>
                <div class="input-group">
                    <label>Confirm Password</label>
                    <input id="confirmPassword" type="password">
                </div>
            </div>

            <button type="submit">Create Account</button>

        </form>

        <div class="footer">
            Already have an account?
            <a href="employee-login.html">Login Here</a>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
